<!-- Forzar al mapa a recalcular tamaño Y reencuadrar la vista correctamente
     (soluciona franjas blancas al incrustar el mapa en un iframe/contenedor
     cuyo tamaño final no coincide con el que había en el primer instante de carga) -->
<script>
(function() {
    var mapExtent = [-632400.939942, 4401204.668099, -603295.451459, 4417056.487329];

    function forzarTamanoMapa() {
        if (typeof map !== 'undefined' && map.updateSize) {
            map.updateSize();
            map.getView().fit(mapExtent, { size: map.getSize() });
        }
    }

    window.addEventListener('load', function() {
        forzarTamanoMapa();
        setTimeout(forzarTamanoMapa, 300);
    });

    window.addEventListener('resize', forzarTamanoMapa);
})();
</script>
